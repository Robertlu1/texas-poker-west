<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Texas Poker West - Salón Principal</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            background-color: #080d12;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            overflow: hidden;
        }
        #pantalla-portada {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #111a24;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 99999;
        }
        .btn-entrar {
            background-color: #e67e22; color: white; border: 2px solid #f1c40f;
            padding: 15px 40px; font-size: 22px; font-weight: bold; cursor: pointer;
            border-radius: 8px; margin-top: 20px;
        }
        .btn-entrar:hover { background-color: #d35400; }

        #pantalla-salon {
            display: none; width: 100vw; height: 100vh;
            background: radial-gradient(circle, #1a2634 0%, #080d12 100%);
            padding: 10px; flex-direction: column; justify-content: space-between; align-items: center;
        }
        .poker-table {
            background: #0d4a22; border: 8px solid #3d2314; border-radius: 100px;
            width: 80vw; height: 50vh; margin: 10px auto; position: relative;
        }
        .seat {
            position: absolute; background: #3d2314; border: 2px solid #8b5a2b;
            padding: 6px; border-radius: 8px; font-size: 11px; width: 160px; color: white;
        }
        .seat-1 { top: 10px; left: 20%; }
        .seat-2 { top: 10px; right: 20%; }
        .seat-4 { bottom: 10px; right: 20%; border-color: #27ae60; }
        .seat-5 { bottom: 10px; left: 20%; }
        
        .card {
            background: white; color: black; font-weight: bold; width: 35px; height: 50px;
            display: inline-flex; align-items: center; justify-content: center; border-radius: 4px; margin: 2px;
        }
        .card.red { color: red; }
    </style>
</head>
<body>

    <!-- PORTADA DE EMERGENCIA -->
    <div id="pantalla-portada">
        <h1 style="color: #f1c40f; font-size: 3.5em; margin-bottom: 10px;">Texas Poker West</h1>
        <p style="color: #ccc; font-size: 1.2em;">Salón del Oeste - Acceso Directo</p>
        <button class="btn-entrar" onclick="forzarEntrada()">🤠 Entrar al Salón 🌵</button>
    </div>

    <!-- SALÓN PRINCIPAL -->
    <div id="pantalla-salon">
        <h2>Mesa de Póker Activa</h2>
        
        <div class="poker-table">
            <div class="seat seat-1"><b>Gambusino</b><br>🎰 1,000 Fichas</div>
            <div class="seat seat-2"><b>Don Aurelio</b><br>🎰 1,000 Fichas</div>
            <div class="seat seat-4"><b>Tú (Vaquero)</b><br>🎰 <span id="mis-fichas">1,000</span> Fichas</div>
            <div class="seat seat-5"><b>Sheriff</b><br>🎰 1,000 Fichas</div>
            
            <div style="position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); text-align: center;">
                <div style="color: #f1c40f; font-weight: bold; font-size: 1.2em;" id="bote-texto">BOTE: 150 Fichas</div>
                <div id="cartas-comunitarias" style="margin-top: 8px;">
                    <div class="card">10♠</div><div class="card red">J♥</div><div class="card">Q♣</div>
                </div>
            </div>
        </div>

        <div style="background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px; width: 80vw;">
            <button onclick="accionJuego('pasar')" style="padding: 8px 15px; background: #27ae60; color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 4px;">Pasar (Check)</button>
            <button onclick="accionJuego('igualar')" style="padding: 8px 15px; background: #2980b9; color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; margin-left: 10px;">Igualar (Call)</button>
            <button onclick="accionJuego('retirarse')" style="padding: 8px 15px; background: #c0392b; color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; margin-left: 10px;">Retirarse (Fold)</button>
        </div>
    </div>

    <script>
        function forzarEntrada() {
            document.getElementById('pantalla-portada').style.display = 'none';
            document.getElementById('pantalla-salon').style.display = 'flex';
            console.log("¡Entrada exitosa al salón!");
        }

        function accionJuego(tipo) {
            alert("Acción ejecutada: " + tipo);
        }
    </script>
</body>
</html>
