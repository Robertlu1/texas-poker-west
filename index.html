<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Base Combat</title>
    <!-- 1. LIBRERÍA OFICIAL DE GOOGLE PARA LOGIN REAL -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body, html {
            margin: 0; padding: 0; width: 100vw; height: 100vh;
            /* Pon aquí la ruta de tu imagen de portaaviones de fondo */
            background-color: #0b192c; 
            background-image: url('fondo_portaaviones.jpg'); 
            background-size: cover;
            background-position: center;
            overflow: hidden;
            color: white;
        }

        /* TÍTULO DEL JUEGO */
        .game-title {
            position: absolute;
            top: 40px;
            left: 50px;
            font-size: 3.5rem;
            letter-spacing: 5px;
            color: #ffffff;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.8);
            margin: 0;
            z-index: 10;
        }

        /* =========================================
           BOTÓN DE GOOGLE - SUPERIOR DERECHO
           ========================================= */
        .top-right-auth {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* =========================================
           PANEL CENTRAL - REGISTRO DE USUARIO
           ========================================= */
        .center-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(4, 30, 66, 0.85); /* Azul oscuro militar transparente */
            border: 2px solid #2980b9;
            padding: 30px 50px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 150, 255, 0.3), inset 0 0 15px rgba(0,0,0,0.8);
            z-index: 100;
        }
        .center-panel label {
            display: block;
            color: #45b6fe;
            font-size: 1.2rem;
            margin-bottom: 20px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .input-row {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .input-row input {
            padding: 12px 15px;
            font-size: 16px;
            border: 1px solid #34495e;
            border-radius: 4px;
            width: 250px;
            background: rgba(255,255,255,0.9);
            color: #000;
            outline: none;
        }
        .input-row input:focus { border-color: #2ecc71; }
        
        .btn-jugar {
            background: linear-gradient(to bottom, #2ecc71, #27ae60);
            color: white;
            border: 1px solid #1e8449;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
        }
        .btn-jugar:hover { background: #27ae60; transform: translateY(-1px); }

        .footer-text {
            position: absolute;
            bottom: 10px;
            width: 100%;
            text-align: center;
            font-size: 11px;
            color: #bdc3c7;
            text-shadow: 1px 1px 2px #000;
        }
    </style>
</head>
<body>

    <h1 class="game-title">GLOBAL BASE COMBAT</h1>

    <!-- BOTÓN OFICIAL DE GOOGLE EN LA ESQUINA SUPERIOR DERECHA -->
    <div class="top-right-auth">
        <!-- Reemplaza el data-client_id con tu ID real de Google Cloud Console -->
        <div id="g_id_onload"
             data-client_id="TU_CLIENT_ID_DE_GOOGLE_AQUI.apps.googleusercontent.com"
             data-context="signin"
             data-ux_mode="popup"
             data-callback="procesarLoginGoogle"
             data-auto_prompt="false">
        </div>
        
        <!-- Este div es el que dibuja el botón azul oficial de Google -->
        <div class="g_id_signin"
             data-type="standard"
             data-shape="rectangular"
             data-theme="filled_blue"
             data-text="signin_with"
             data-size="large"
             data-logo_alignment="left">
        </div>
    </div>

    <!-- PANEL CENTRAL DE REGISTRO / LOGIN LOCAL -->
    <div class="center-panel">
        <label for="nombreJugador">Elija su nombre de jugador</label>
        <div class="input-row">
            <input type="text" id="nombreJugador" placeholder="Nombre">
            <button class="btn-jugar" onclick="iniciarConNombre()">⚔️ Jugar</button>
        </div>
    </div>

    <div class="footer-text">
        Global Base Combat es un juego de estrategia militar en tiempo real que puedes jugar directamente en tu navegador sin instalación.<br>
        GBC | Aviso Legal | Privacidad | SUPPORT | AUTOGAMES | Términos | Página de ayuda
    </div>

    <script>
        // Acción de registro con el botón verde central
        function iniciarConNombre() {
            let nombre = document.getElementById('nombreJugador').value.trim();
            if(nombre !== "") {
                alert("🎮 Iniciando juego como: " + nombre);
                // Aquí integras la lógica para entrar a la mesa o backend
            } else {
                alert("⚠️ Por favor, escribe un nombre de jugador.");
            }
        }

        // Acción REAL de registro con Google (Callback de Google Identity Services)
        function procesarLoginGoogle(respuesta) {
            // Google devuelve un token JWT con la información del usuario
            const tokenJWT = respuesta.credential;
            
            // Decodificamos el Payload del JWT para extraer los datos reales
            const base64Url = tokenJWT.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const payloadDecodificado = JSON.parse(window.atob(base64));

            console.log("Datos de Google recibidos:", payloadDecodificado);
            
            // Extraemos correo y nombre real del usuario de Google
            const emailUsuario = payloadDecodificado.email;
            const nombreGoogle = payloadDecodificado.name;
            
            // Mostrar en pantalla o procesar en tu base de datos
            alert(`✅ Login Real Exitoso con Google.\n\nBienvenido, ${nombreGoogle}\nCorreo: ${emailUsuario}`);
            
            // Si quieres, puedes autocompletar el campo central:
            document.getElementById('nombreJugador').value = nombreGoogle;
        }
    </script>
</body>
</html>
